[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evilmerge"
version = "0.1.0"
description = "Find merge commits that quietly changed something git would not have: dropped changes and content from nowhere."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["git", "merge", "evil-merge", "code-review", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
evilmerge = "evilmerge.cli:main"

[project.urls]
Source = "https://github.com/committed-nightly/evilmerge"

[tool.hatch.build.targets.wheel]
packages = ["src/evilmerge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
